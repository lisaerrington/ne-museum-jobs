name: Update museum jobs

on:
  schedule:
    # 06:15 and 13:15 UK time (05:15 / 12:15 UTC) every day
    - cron: "15 5,12 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline tests
        run: python scraper/tests/test_scrape.py

      - name: Scrape all sources
        run: python scraper/scrape.py

      - name: Commit updated jobs.json
        run: |
          git config user.name  "museum-jobs-bot"
          git config user.email "museum-jobs-bot@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
